# Environnement de développement Snow Wild.
# Lancement : docker compose up --build
#   - front-end  : http://localhost:3000
#   - API        : http://localhost:4000/graphql (Apollo Sandbox)
#   - pgAdmin    : http://localhost:5050
name: snow-wild

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - snow-net

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - snow-net

  backend:
    build: ./backend
    restart: unless-stopped
    # Installe les dépendances manquantes au démarrage (rapide si rien n'a changé),
    # pour que l'ajout d'un paquet npm ne demande pas de manipulation de volumes.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/test:/app/test
      - ./backend/jest.config.js:/app/jest.config.js
      - ./backend/tsconfig.test.json:/app/tsconfig.test.json
      - backend_node_modules:/app/node_modules
    env_file: .env
    environment:
      DB_HOST: db
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - snow-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - snow-net

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:

# Réseau commun : les conteneurs se joignent par leur nom de service (db, backend…).
networks:
  snow-net:
    driver: bridge
