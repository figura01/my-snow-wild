name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # 1. Vérifications : TypeScript strict, tests automatisés et build de production.
  check:
    name: Vérifier ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # Base PostgreSQL éphémère pour les tests d'intégration de l'API.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snowwild
          POSTGRES_PASSWORD: snowwild
          POSTGRES_DB: snowwild
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snowwild"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          DB_HOST: localhost
          POSTGRES_USER: snowwild
          POSTGRES_PASSWORD: snowwild
          POSTGRES_DB: snowwild
      - run: npm run build

  # 2. Images Docker publiées sur GitHub Container Registry (uniquement sur main).
  images:
    name: Publier les images
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          file: ${{ matrix.app }}/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/figura01/my-snow-wild-${{ matrix.app }}:latest
            ghcr.io/figura01/my-snow-wild-${{ matrix.app }}:${{ github.sha }}

  # 3. Déploiement sur le VPS. Désactivé tant que la variable de dépôt
  #    DEPLOY_ENABLED ne vaut pas « true » (Settings > Secrets and variables > Actions).
  deploy:
    name: Déployer sur le VPS
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /srv/snow-wild
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Supprime les anciennes images pour ne pas remplir le disque du VPS.
            docker image prune -f
