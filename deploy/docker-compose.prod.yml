# Production Snow Wild sur le VPS, derrière le Caddy de /srv/vps-infra.
#
# Les images sont construites par la CI (GitHub Actions) et publiées sur GHCR.
# Lancement sur le VPS, dans le dossier qui contient ce fichier et le .env :
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
name: snow-wild

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Pas de port exposé : la base n'est joignable que par l'API.
    networks:
      - snow-net

  backend:
    image: ghcr.io/figura01/my-snow-wild-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - snow-net
      - proxy

  frontend:
    image: ghcr.io/figura01/my-snow-wild-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - snow-net
      - proxy

volumes:
  pgdata:

networks:
  snow-net:
    driver: bridge
  # Réseau du Caddy existant (/srv/vps-infra) : permet à Caddy de joindre
  # « frontend » et « backend » par leur nom. Vérifie son nom exact sur le VPS
  # avec « docker network ls » (souvent vps-infra_internal).
  proxy:
    external: true
    name: ${PROXY_NETWORK:-vps-infra_internal}
